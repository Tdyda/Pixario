services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - mysql
    expose:
      - 9000
    environment:
      DATABASE_URL: "mysql://symfony:symfony@mysql:3306/symfony"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - 80

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./api:/var/www/html
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend

  mysql:
    image: mariadb:10.6
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "W8YhawRXY62qDmU90OU6k6+rk38vdGANaqocPbHdDSA="
      MERCURE_SUBSCRIBER_JWT_KEY: "W8YhawRXY62qDmU90OU6k6+rk38vdGANaqocPbHdDSA="
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000 http://pixario.pl
        anonymous

volumes:
  db_data:
  vendor: