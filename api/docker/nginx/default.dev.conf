server {
    listen 80;
    server_name pixario.dev.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name pixario.dev.pl;

    ssl_certificate /etc/letsencrypt/live/pixario.dev.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixario.dev.pl/privkey.pem;

    client_max_body_size 500M;

    root /var/www/html/public;
    index index.php;

    location ^~ /api {
	client_max_body_size 500M;

	client_body_timeout 300s;
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;

	fastcgi_request_buffering off;
        try_files $uri /index.php$is_args$args;
    }

    location ^~ /webhooks {
        try_files $uri /index.php$is_args$args;
    }

    location /.well-known/mercure {
	proxy_pass http://mercure/.well-known/mercure;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;

	proxy_buffering off;
	proxy_cache off;

	proxy_read_timeout 24h;
	proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;

        fastcgi_pass api:9000;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;

	fastcgi_read_timeout 300;
	fastcgi_send_timeout 300;
	fastcgi_connect_timeout 60;
	fastcgi_request_buffering off;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }
}
